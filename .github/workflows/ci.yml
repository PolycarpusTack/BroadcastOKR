name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: broadcastokr/package-lock.json

      - name: Install dependencies
        working-directory: broadcastokr
        run: npm ci

      - name: TypeScript check
        working-directory: broadcastokr
        run: npx tsc --noEmit

      - name: Lint
        working-directory: broadcastokr
        run: npm run lint

      - name: Run unit tests
        working-directory: broadcastokr
        run: npx vitest run

      - name: Run bridge tests
        working-directory: broadcastokr
        run: node --test bridge/__tests__/*.test.cjs

      - name: Build
        working-directory: broadcastokr
        # Use the real build script (tsc -b && vite build) so the project
        # references and noUnusedLocals checks run, matching local `npm run build`.
        run: npm run build

      - name: Edition bundle check (desktop)
        working-directory: broadcastokr
        run: node scripts/check-edition-bundle.mjs desktop

  editions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        edition: [client, internal]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: broadcastokr/package-lock.json

      - name: Install dependencies
        working-directory: broadcastokr
        run: npm ci

      - name: Build ${{ matrix.edition }} edition
        working-directory: broadcastokr
        run: VITE_EDITION=${{ matrix.edition }} npx vite build

      - name: Edition bundle check (FF-1)
        working-directory: broadcastokr
        run: node scripts/check-edition-bundle.mjs ${{ matrix.edition }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: broadcastokr/package-lock.json

      - name: Install dependencies
        working-directory: broadcastokr
        run: npm ci

      - name: Install Playwright browser
        working-directory: broadcastokr
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: broadcastokr
        # playwright.config starts the bridge + vite dev server automatically.
        run: npx playwright test

  bridge-runtime:
    # F3 (review 2026-09-07): the instance image installs bridge/package.json +
    # its lockfile with no application node_modules around. Prove that graph
    # resolves every runtime module on its own — including the lazily imported
    # SSO client — before an image that only "builds and answers /api/health"
    # gets published.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Isolated bridge install (lockfile only)
        run: |
          set -e
          mkdir -p /tmp/bridge-runtime
          cp broadcastokr/bridge/package.json broadcastokr/bridge/package-lock.json /tmp/bridge-runtime/
          cd /tmp/bridge-runtime
          npm ci --omit=dev

      - name: Runtime import contract
        working-directory: /tmp/bridge-runtime
        run: |
          node -e "for (const m of [\"express\",\"better-sqlite3\",\"cors\",\"dotenv\",\"express-rate-limit\",\"morgan\",\"rotating-file-stream\"]) require(m); import(\"openid-client\").then((o) => { if (typeof o.discovery !== \"function\") throw new Error(\"openid-client v6 API missing\"); console.log(\"bridge runtime graph OK\"); })"
