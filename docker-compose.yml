version: "3.8"

services:
  bridge:
    # The instance image: app bundle + bridge (broadcastokr/Dockerfile). Tagged
    # images are published by the release workflow as
    # ghcr.io/<owner>/broadcastokr-instance:<version>-{client,cockpit}.
    build:
      context: ./broadcastokr
      args:
        EDITION: client
        MODE: client
    ports:
      - "3001:3001"
    volumes:
      - bridge-data:/app/data
      - bridge-logs:/app/logs
      - bridge-backups:/app/backups
    env_file:
      - ./broadcastokr/bridge/.env
    environment:
      # The bridge binds 127.0.0.1 by default; containers must listen on all interfaces.
      BRIDGE_HOST: 0.0.0.0
    restart: unless-stopped

volumes:
  bridge-data:
  bridge-logs:
  bridge-backups:
