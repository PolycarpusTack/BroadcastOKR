version: "3.8"

services:
  bridge:
    build: ./broadcastokr/bridge
    ports:
      - "3001:3001"
    volumes:
      - bridge-data:/app/data
      - bridge-logs:/app/logs
      - bridge-backups:/app/backups
    env_file:
      - ./broadcastokr/bridge/.env
    environment:
      # The bridge binds 127.0.0.1 by default; containers must listen on all interfaces.
      BRIDGE_HOST: 0.0.0.0
    restart: unless-stopped

volumes:
  bridge-data:
  bridge-logs:
  bridge-backups:
